<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2059aa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="領航點名：人員差勤選擇、即時統計與離線回報。"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>領航點名</title><style>html{color-scheme:light}body{margin:0;background:#edf1f6}*{box-sizing:border-box}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #87b4f5;outline-offset:2px}</style></head><body><div id="daily-roll" >
<style>
#daily-roll{padding:20px 8px;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#daily-roll .mobile{max-width:480px;margin:auto;padding:22px 16px;border-radius:24px;background:light-dark(#f2f4f8,#181a20);color:light-dark(#182334,#f1f3f7);border:1px solid light-dark(#dae0e8,#343a44)}#daily-roll h2{font-size:22px;margin:0 0 6px}#daily-roll .muted{color:light-dark(#586477,#b1bccb);font-size:13px}#daily-roll nav{display:flex;gap:6px;margin:20px 0 16px}#daily-roll button,#daily-roll input,#daily-roll select{font:inherit;font-size:16px;min-height:44px;box-sizing:border-box;border:1px solid light-dark(#d7dfe9,#424a57);border-radius:9px;padding:8px 10px;background:light-dark(#fff,#252b35);color:inherit;min-width:0}#daily-roll button{cursor:pointer}#daily-roll pre{border:1px solid #ccd5e0}#daily-roll .row:last-child{border:0}#daily-roll nav button{flex:1;font-size:14px;padding:8px 4px}#daily-roll button.active,#daily-roll .main{background:light-dark(#2059aa,#89b9ff);color:light-dark(#fff,#12233d);border-color:transparent}#daily-roll .row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid light-dark(#e0e5ed,#353b46)}#daily-roll .row label{flex:1;overflow-wrap:anywhere}#daily-roll select{width:130px}#daily-roll .row input{flex:1;width:80px}#daily-roll .delete{color:light-dark(#b32636,#ff9eaa);font-size:14px}#daily-roll .main{width:100%;margin-top:18px}#daily-roll .add{display:flex;gap:8px;margin-top:14px}#daily-roll .add input{flex:1;width:100px}#daily-roll pre{font:inherit;font-size:18px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;margin:18px 0;background:light-dark(#fff,#252b35);padding:16px;border-radius:12px}#daily-roll .notice{margin:10px 0;font-size:14px;color:light-dark(#a52232,#ffadb5)}
</style>
<div class="mobile"><h2>領航點名</h2><div class="muted" id="dr-date"></div><nav aria-label="點名功能"><button data-view="daily" class="active">今日點名</button><button data-view="people">人員管理</button><button data-view="duties">差勤管理</button></nav><div id="dr-content"></div><p class="muted" id="storage-note" role="status"></p><p class="muted" id="offline-note">首次連網開啟後，可加入主畫面使用。</p></div>
<script>
(()=>{const root=document.getElementById('daily-roll'),area=root.querySelector('#dr-content');let people=['文任教官','大緯','培華','映辰','娸蓒','彥名','春雅','柏威'].map((name,id)=>({name,id,duty:'實到'}));let duties=['休假','飛行','45/60','模擬機','受訓','公差','體檢'];let view='daily',pending=null,nextId=8;let date=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric'}).format(new Date());const storageKey='emma-rollcall-v1';let dayKey=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved&&Array.isArray(saved.people)&&Array.isArray(saved.duties)){people=saved.people;duties=saved.duties;nextId=Math.max(0,...people.map(p=>p.id))+1;if(saved.day!==dayKey)people.forEach(p=>p.duty='實到')}}catch(e){}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({people,duties,day:dayKey}));document.getElementById('storage-note').textContent='已自動儲存在此裝置'}catch(e){document.getElementById('storage-note').textContent='無法儲存，請勿關閉頁面'}}
function checkDay(){const now=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());if(now!==dayKey){dayKey=now;date=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric'}).format(new Date());people.forEach(p=>p.duty='實到');render()}}
setInterval(checkDay,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay()});
root.querySelector('#dr-date').textContent=date+' · 應到 '+people.length+' 人';const el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};function btn(text,fn,cls){const b=el('button',text);b.type='button';if(cls)b.className=cls;b.onclick=fn;return b}function render(){save();area.replaceChildren();root.querySelector('#dr-date').textContent=date+' · 應到 '+people.length+' 人';root.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='daily'){area.append(el('div','沒調整的人員，預設為實到。'));people.forEach(p=>{const row=el('div');row.className='row';const label=el('label',p.name),s=el('select');s.id='dr-person-'+p.id;label.htmlFor=s.id;['實到',...duties].forEach(d=>{const o=el('option',d);o.value=d;s.append(o)});s.value=p.duty;s.onchange=()=>{p.duty=s.value;save();updateResult()};row.append(label,s);area.append(row)});const result=el('pre');result.id='dr-result';result.setAttribute('aria-live','polite');area.append(result);updateResult();return}const isPeople=view==='people';area.append(el('div',isPeople?'新增、修改或刪除人員':'實到為固定預設，其他差勤可修改'));const items=isPeople?people:duties;items.forEach((item,i)=>{const name=isPeople?item.name:item;const row=el('div');row.className='row';const input=el('input');input.value=name;input.setAttribute('aria-label',isPeople?'人員姓名':'差勤名稱');input.onchange=()=>{const v=input.value.trim();if(!v||items.some((x,j)=>j!==i&&(isPeople?x.name:x)===v)){input.value=name;return}if(isPeople)item.name=v;else{duties[i]=v;people.forEach(p=>{if(p.duty===name)p.duty=v})}save()};row.append(input,btn('刪除',()=>{pending={isPeople,index:i,name:isPeople?item.name:duties[i]};confirmDelete()},'delete'));area.append(row)});const add=el('div');add.className='add';const input=el('input');input.placeholder=isPeople?'輸入新姓名':'輸入新差勤';input.setAttribute('aria-label',input.placeholder);const position=el('select');position.setAttribute('aria-label','插入位置');
const end=el('option','放在最後');end.value=items.length;position.append(end);
items.forEach((item,index)=>{const option=el('option','插在'+(isPeople?item.name:item)+'前');option.value=index;position.append(option)});
position.style.width='100%';position.style.marginTop='10px';
add.append(input,btn('新增',()=>{const v=input.value.trim();if(!v||v==='實到'||items.some(x=>(isPeople?x.name:x)===v))return;const index=Number(position.value);items.splice(index,0,isPeople?{id:nextId++,name:v,duty:'實到'}:v);render()}));area.append(add,position)}function confirmDelete(){render();const box=el('div');box.setAttribute('role','alert');box.className='notice';const blocked=!pending.isPeople&&people.some(p=>p.duty===pending.name);box.append(el('p',blocked?'「'+pending.name+'」有人使用，請先到今日點名更改差勤。':'確定刪除「'+pending.name+'」？'));if(!blocked)box.append(btn('確認刪除',()=>{if(pending.isPeople)people.splice(pending.index,1);else duties.splice(pending.index,1);pending=null;render()},'delete'));box.append(btn('取消',()=>{pending=null;render()}));area.prepend(box)}function updateResult(){const output=root.querySelector('#dr-result');if(!output)return;const lines=[date,'領航點名','應到：'+people.length];[...duties,'實到'].forEach(d=>{const list=people.filter(p=>p.duty===d);if(list.length||d==='實到')lines.push(d+'：'+list.length+(list.length?'（'+list.map(p=>p.name).join('、')+'）':''))});output.textContent=lines.join('\n')}root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render()})();
</script>
</div>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{document.getElementById('offline-note').textContent='離線功能已就緒 · 名單僅存於此裝置'}).catch(()=>{document.getElementById('offline-note').textContent='離線功能尚未就緒，請保持連線'})}</script></body></html>
